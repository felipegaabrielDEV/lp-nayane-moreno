<!-- CARTÃO DE COMPARTILHAMENTO (a imagem que aparece quando alguém manda o link no WhatsApp, Instagram, etc.).
     Para gerar a imagem: abra este arquivo no navegador, deixe a janela em 1200 × 630 px e tire um print;
     ou rode `ferramentas/gerar-cartao.js` (Playwright), que salva direto em assets/compartilhar/.
     Ao mudar o cartão, salve a imagem com OUTRO nome (a data no fim) e troque o endereço nas meta tags og:image
     e twitter:image do index.html — o WhatsApp guarda a prévia antiga por muito tempo.
     Texto: sem preço, sem promessa de resultado e sem superlativo; a identificação (CRO-SE 2301) fica visível. -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --marca:#16AD8E; --botao:#0F7A64; --verde:#0F3F36; --verde-2:#0F7A64;
    --menta:#E8F6F1; --menta-2:#CDEBE2; --fundo:#F7F9F8; --tinta:#303B39; --texto:#56615F;
  }
  body { width:1200px; height:630px; overflow:hidden; font-family:"Montserrat",sans-serif;
         background:linear-gradient(135deg,#FFFFFF 0%,var(--fundo) 45%,var(--menta) 100%); position:relative; }

  /* Arco menta com a foto dentro, igual ao topo do site */
  .retrato { position:absolute; right:58px; bottom:0; width:468px; height:556px;
             border-radius:234px 234px 0 0; overflow:hidden;
             background:linear-gradient(180deg,var(--menta) 0%,#DCF0E9 100%); }
  .retrato img { width:100%; height:100%; object-fit:cover; object-position:50% 4%; }
  .retrato::after { content:""; position:absolute; inset:0; border-radius:inherit;
                    box-shadow:inset 0 0 0 1px #16AD8E26; }

  /* Fio metálico com o bráquete, detalhe da marca, arcando sobre o retrato */
  .fio { position:absolute; right:34px; top:8px; width:516px; height:84px; }

  .texto { position:absolute; left:64px; top:60px; width:620px; }
  .logo { height:76px; margin-bottom:34px; }
  .rotulo { display:flex; align-items:center; gap:12px; font-size:16px; font-weight:700;
            letter-spacing:.16em; text-transform:uppercase; color:var(--botao); margin-bottom:18px; }
  .rotulo::before { content:""; width:32px; height:3px; border-radius:2px; background:var(--marca); }
  h1 { font-size:50px; line-height:1.14; font-weight:700; color:var(--tinta); letter-spacing:-.01em; }
  h1 em { display:block; font-style:normal; font-weight:400; color:var(--verde-2); margin-top:6px; }
  .pills { display:flex; gap:10px; margin-top:30px; flex-wrap:wrap; }
  .pill { padding:10px 18px; border-radius:999px; background:#fff; border:1px solid var(--menta-2);
          font-size:16px; font-weight:600; color:var(--verde); box-shadow:0 6px 18px -12px #0F3F3640; }

  /* Cartão de identificação sobre a foto */
  .cartao { position:absolute; right:338px; bottom:58px; padding:16px 22px; border-radius:16px;
            background:#fff; box-shadow:0 20px 44px -22px #0F3F3666; border:1px solid #FFFFFF; min-width:290px; }
  .cartao strong { display:block; font-size:21px; font-weight:700; color:var(--tinta); }
  .cartao span { display:block; margin-top:3px; font-size:15px; font-weight:500; color:var(--texto); }

  .site { position:absolute; left:64px; bottom:54px; font-size:17px; font-weight:600;
          letter-spacing:.02em; color:var(--verde-texto,#4F6B66); }
</style>
</head>
<body>
  <svg class="fio" viewBox="0 0 520 90" fill="none" aria-hidden="true">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#AEBDBA"/><stop offset=".22" stop-color="#E6EDEC"/>
        <stop offset=".5" stop-color="#9FB2AE"/><stop offset=".78" stop-color="#E6EDEC"/>
        <stop offset="1" stop-color="#AEBDBA"/>
      </linearGradient>
    </defs>
    <path d="M6 16 Q258 92 510 16" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>
    <g transform="translate(258,50)">
      <rect x="-19" y="-11" width="38" height="22" rx="6" fill="#CDEBE2" stroke="#16AD8E" stroke-width="2"/>
      <rect x="-6" y="-7" width="4" height="14" rx="2" fill="#16AD8E"/>
      <rect x="2" y="-7" width="4" height="14" rx="2" fill="#16AD8E"/>
    </g>
  </svg>

  <div class="retrato"><img src="../assets/profissional/dra-nayane-topo-900.webp" alt=""></div>

  <div class="texto">
    <img class="logo" src="../assets/marca/logo-completa.png" alt="">
    <div class="rotulo">Ortodontia em Aracaju</div>
    <h1>O sorriso dos sonhos,<em>sem passar anos usando aparelho?</em></h1>
    <div class="pills">
      <span class="pill">Aparelho metálico e de porcelana</span>
      <span class="pill">Convênio ou particular</span>
    </div>
  </div>

  <div class="cartao">
    <strong>Dra. Nayane Moreno</strong>
    <span>Cirurgiã-Dentista · CRO-SE 2301</span>
  </div>

  <div class="site">dranayanemorenoortodontia.com.br</div>
</body>
</html>
